name: Desplegar frontend

# El repositorio del frontend no está conectado a la app de GitHub de Render (pertenece a otra
# cuenta), así que sus merges no llegan a Render. Este workflow revisa periódicamente las ramas
# lab y main del frontend y despliega en Render los commits nuevos cuyo CI pasó.
# Ver .github/scripts/deploy_frontend.py y docs/DESPLIEGUE.md.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar commits nuevos del frontend
        run: python3 .github/scripts/deploy_frontend.py
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
