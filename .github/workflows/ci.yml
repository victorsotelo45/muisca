name: CI backend

# Render despliega lab/main solo cuando este workflow termina bien (autoDeployTrigger: checksPass).
on:
  push:
    branches: [main, lab]
  pull_request:
    branches: [main, lab]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Motores MDE y flujo completo de la API (perfil test con base H2 en memoria).
      - name: Pruebas
        run: ./mvnw -B test
      - name: Construir la imagen Docker
        run: docker build -t muisca-api .
