name: CI backend

# Render despliega lab/main solo cuando este workflow termina bien (autoDeployTrigger: checksPass).
on:
  push:
    branches: [main, lab]
  pull_request:
    branches: [main, lab]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # MuiscawebApplicationTests levanta el contexto completo y necesita MySQL: se excluye aquí.
      - name: Pruebas de los motores MDE
        run: ./mvnw -B test -Dtest='!MuiscawebApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Construir la imagen Docker
        run: docker build -t muisca-api .
