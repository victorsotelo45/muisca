# Infraestructura de MUISCA en Render: dos entornos completos, gratuitos y con despliegue automático.
#
#   rama lab  -> Laboratorio:  muisca-unicauca-api-lab  +  muisca-unicauca-web-lab  (base muisca_lab)
#   rama main -> Producción:   muisca-unicauca-api      +  muisca-unicauca-web      (base muisca_prod)
#
# Flujo: feature/* -> PR a lab (se despliega Laboratorio) -> PR lab -> main (se despliega Producción).
# Backend: Render despliega cuando pasa su CI. Frontend: su propio CI despliega tras pasar las pruebas.
#
# Los servicios se crearon con la API de Render (2026-10-12); este archivo documenta su
# configuración y sirve para recrearlos como Blueprint. Base de datos: Aiven for MySQL, plan
# Free (servicio "muisca", bases muisca_lab y muisca_prod). Los secretos (sync: false) no se versionan.
# Guía completa y cambio a MySQL u otro PostgreSQL: docs/DESPLIEGUE.md

services:
  # ------------------------------------------------------------------ Producción
  - type: web
    name: muisca-unicauca-api
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/victorsotelo45/muisca
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DB_URL
        sync: false # jdbc:mysql://<host-aiven>:<puerto>/muisca_prod?sslMode=REQUIRED
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false # mínimo 64 caracteres aleatorios, distinto del de laboratorio
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://muisca-unicauca-web.onrender.com
      - key: JPA_SHOW_SQL
        value: "false"
      - key: DB_POOL_SIZE
        value: "3"

  - type: web
    name: muisca-unicauca-web
    runtime: static
    repo: https://github.com/victorsotelo45/muisca_frontend
    branch: main
    buildCommand: npm ci && npm run build && node scripts/write-runtime-config.mjs
    staticPublishPath: ./dist/zenodo-muisca/browser
    # El CI del repo del frontend despliega cada merge (job deploy); Render no dispara solo.
    autoDeployTrigger: "off"
    envVars:
      - key: API_URL
        value: https://muisca-unicauca-api.onrender.com
      - key: NODE_VERSION
        value: "22"
      - key: GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # ------------------------------------------------------------------ Laboratorio
  - type: web
    name: muisca-unicauca-api-lab
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/victorsotelo45/muisca
    branch: lab
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DB_URL
        sync: false # jdbc:mysql://<host-aiven>:<puerto>/muisca_lab?sslMode=REQUIRED
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://muisca-unicauca-web-lab.onrender.com
      - key: JPA_SHOW_SQL
        value: "false"
      - key: DB_POOL_SIZE
        value: "3"

  - type: web
    name: muisca-unicauca-web-lab
    runtime: static
    repo: https://github.com/victorsotelo45/muisca_frontend
    branch: lab
    buildCommand: npm ci && npm run build && node scripts/write-runtime-config.mjs
    staticPublishPath: ./dist/zenodo-muisca/browser
    # El CI del repo del frontend despliega cada merge (job deploy); Render no dispara solo.
    autoDeployTrigger: "off"
    envVars:
      - key: API_URL
        value: https://muisca-unicauca-api-lab.onrender.com
      - key: NODE_VERSION
        value: "22"
      - key: ENVIRONMENT_NAME
        value: Laboratorio
      - key: GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
