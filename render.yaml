# Blueprint de Render para MUISCA: dos entornos completos, gratuitos y con despliegue automático.
#
#   rama lab  → Laboratorio:  muisca-unicauca-api-lab  +  muisca-unicauca-web-lab
#   rama main → Producción:   muisca-unicauca-api      +  muisca-unicauca-web
#
# Flujo: feature/* → PR a lab (se despliega Laboratorio) → PR lab → main (se despliega Producción).
# Cada servicio se redespliega solo cuando el CI de GitHub Actions de su repositorio pasa.
#
# Los valores marcados con `sync: false` son secretos: Render los pide al crear el Blueprint.
# Base de datos: MySQL gratuito de Aiven (una instancia con dos bases: muisca_lab y muisca_prod).
# Guía completa: docs/DESPLIEGUE.md

services:
  # ------------------------------------------------------------------ Producción
  - type: web
    name: muisca-unicauca-api
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/victorsotelo45/muisca
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DB_URL
        sync: false # jdbc:mysql://<host>:<puerto>/muisca_prod?sslMode=REQUIRED&createDatabaseIfNotExist=true
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false # mínimo 64 caracteres aleatorios, distinto del de laboratorio
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://muisca-unicauca-web.onrender.com
      - key: JPA_SHOW_SQL
        value: "false"
      - key: DB_POOL_SIZE
        value: "3"

  - type: web
    name: muisca-unicauca-web
    runtime: static
    repo: https://github.com/cristianbelal/muiscaFrontend
    branch: main
    buildCommand: npm ci && npm run build && node scripts/write-runtime-config.mjs
    staticPublishPath: ./dist/zenodo-muisca/browser
    autoDeployTrigger: checksPass
    envVars:
      - key: API_URL
        value: https://muisca-unicauca-api.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # ------------------------------------------------------------------ Laboratorio
  - type: web
    name: muisca-unicauca-api-lab
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/victorsotelo45/muisca
    branch: lab
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DB_URL
        sync: false # jdbc:mysql://<host>:<puerto>/muisca_lab?sslMode=REQUIRED&createDatabaseIfNotExist=true
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://muisca-unicauca-web-lab.onrender.com
      - key: JPA_SHOW_SQL
        value: "false"
      - key: DB_POOL_SIZE
        value: "3"

  - type: web
    name: muisca-unicauca-web-lab
    runtime: static
    repo: https://github.com/cristianbelal/muiscaFrontend
    branch: lab
    buildCommand: npm ci && npm run build && node scripts/write-runtime-config.mjs
    staticPublishPath: ./dist/zenodo-muisca/browser
    autoDeployTrigger: checksPass
    envVars:
      - key: API_URL
        value: https://muisca-unicauca-api-lab.onrender.com
      - key: ENVIRONMENT_NAME
        value: Laboratorio
      - key: GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
