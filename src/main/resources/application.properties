spring.application.name=muiscaweb

# Carga las variables desde .env (raíz del proyecto) si existe; en producción se usan variables del sistema
spring.config.import=optional:file:.env[.properties]

# Configuración de la base de datos MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Secreto usado para firmar los JWT propios (HS512). Debe ser un valor aleatorio
# largo y distinto por entorno, nunca versionado en texto plano.
jwt.secret=${JWT_SECRET}

# Bootstrap del primer usuario ADMIN (opcional). Si no se definen, no se crea
# ningún administrador automáticamente y deberá promoverse manualmente en la BD.
admin.bootstrap.username=${ADMIN_USERNAME:}
admin.bootstrap.password=${ADMIN_PASSWORD:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB
